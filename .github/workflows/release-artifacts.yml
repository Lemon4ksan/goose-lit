name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: release-linux
          - os: windows-latest
            artifact-name: release-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Goose toolchain
        id: cache-goose
        uses: actions/cache@v4
        with:
          path: |
            ~/.goose
            /opt/goose-v2026.3-linux-x64
          key: ${{ runner.os }}-goose-v2026.3

      - name: Install build tools and C compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc clang make curl ca-certificates

      - name: Bootstrap Goose compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -f /opt/goose-v2026.3-linux-x64/goose ]; then
            sudo mkdir -p /opt
            curl -sSL --retry 5 --retry-delay 2 --retry-connrefused https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-linux-x64.tar.gz | sudo tar -xz -C /opt
          fi
          sudo ln -sf /opt/goose-v2026.3-linux-x64/goose /usr/local/bin/goose

      - name: Bootstrap Goose compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gooseDir = "$HOME\.goose\goose-v2026.3-windows-x64"
          if (-not (Test-Path "$gooseDir\goose.exe")) {
            New-Item -ItemType Directory -Force -Path "$HOME\.goose" | Out-Null
            $zipPath = "$HOME\.goose\goose.zip"
            $url = "https://github.com/aardappel/goose/releases/download/v2026.3/goose-v2026.3-windows-x64.zip"
            for ($i = 1; $i -le 5; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $zipPath
                break
              } catch {
                if ($i -eq 5) { throw }
                Start-Sleep -Seconds 2
              }
            }
            Expand-Archive -Path $zipPath -DestinationPath "$HOME\.goose" -Force
            Remove-Item $zipPath -Force
            if (-not (Test-Path "$gooseDir\goose.exe")) {
              New-Item -ItemType Directory -Force -Path $gooseDir | Out-Null
              Move-Item "$HOME\.goose\*" "$gooseDir\" -Exclude "goose-v2026.3-windows-x64" -Force
            }
          }
          "$gooseDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          goose build -O2 -o bin/goose-lit bin.goose

      - name: Archive binary (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf goose-lit-${{ github.event.release.tag_name }}-linux-x64.tar.gz -C bin goose-lit

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path bin)) { New-Item -ItemType Directory -Path bin | Out-Null }
          goose build --cc gcc -O2 -o bin/goose-lit.exe bin.goose

      - name: Archive binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path bin/goose-lit.exe -DestinationPath goose-lit-${{ github.event.release.tag_name }}-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            goose-lit-*.tar.gz
            goose-lit-*.zip
          if-no-files-found: error

  publish:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Compute SHA-256 checksums
        run: |
          sha256sum goose-lit-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} goose-lit-*.tar.gz goose-lit-*.zip SHA256SUMS.txt --clobber
